
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: media-downloader-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: media-downloader-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend